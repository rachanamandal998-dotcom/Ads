<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SindhuliBazar — Fresh Food Delivered Fast</title>
  <link rel="stylesheet" href="style.css">
</head>


<body>
  <audio id="bgSound" loop muted>
    <source src="music1.mp3" type="audio/mpeg">
  </audio>

  <!-- LOADER -->
  <div id="loader">
    <div class="loader-logo">Sindhu<span>li</span>Bazar</div>
    <div class="loader-ring"></div>
    <div class="loader-tag">Loading Experience</div>
  </div>

  <!-- MAIN SCENE -->
  <div class="scene" id="scene">
    <div class="sky"></div>
    <div class="stars" id="stars"></div>
    <div class="moon"></div>

    <svg class="cloud-layer" style="height:120px" viewBox="0 0 2400 120" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="200" cy="70" rx="180" ry="40" fill="rgba(120,60,160,0.25)" filter="url(#blur)" />
      <ellipse cx="600" cy="80" rx="220" ry="35" fill="rgba(100,50,140,0.2)" filter="url(#blur)" />
      <ellipse cx="1050" cy="65" rx="160" ry="38" fill="rgba(130,65,170,0.22)" filter="url(#blur)" />
      <ellipse cx="1800" cy="68" rx="170" ry="36" fill="rgba(125,60,165,0.2)" filter="url(#blur)" />
      <defs>
        <filter id="blur">
          <feGaussianBlur stdDeviation="8" />
        </filter>
      </defs>
    </svg>

    <svg class="city-layer city-far" style="height:160px" viewBox="0 0 2400 160" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <g fill="rgba(40,20,70,0.7)">
        <rect x="0" y="60" width="30" height="100" />
        <rect x="90" y="30" width="35" height="130" />
        <rect x="235" y="35" width="40" height="125" />
        <rect x="310" y="20" width="30" height="140" />
        <rect x="600" y="25" width="35" height="135" />
        <rect x="915" y="20" width="35" height="140" />
        <rect x="1280" y="25" width="40" height="135" />
        <rect x="1690" y="30" width="35" height="130" />
        <rect x="2095" y="20" width="40" height="140" />
      </g>
    </svg>

    <svg class="city-layer city-mid" style="height:210px" viewBox="0 0 2400 210" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <g fill="rgba(30,15,55,0.85)">
        <rect x="30" y="110" width="80" height="100" />
        <rect x="200" y="60" width="70" height="150" />
        <rect x="440" y="40" width="90" height="170" />
        <rect x="685" y="20" width="65" height="190" />
        <rect x="925" y="60" width="80" height="150" />
        <rect x="1110" y="30" width="70" height="180" />
        <rect x="1310" y="60" width="65" height="150" />
        <rect x="1685" y="55" width="80" height="155" />
        <rect x="2010" y="30" width="70" height="180" />
      </g>
    </svg>

    <svg class="lights-layer" style="height:85px" viewBox="0 0 2400 85" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <g fill="rgba(60,50,40,0.9)">
        <rect x="100" y="20" width="5" height="65" />
        <circle cx="82" cy="20" r="7" fill="rgba(255,230,100,0.9)" />
        <rect x="580" y="5" width="6" height="80" />
        <circle cx="583" cy="13" r="5" fill="rgba(255,50,50,0.9)" />
        <rect x="1020" y="20" width="5" height="65" />
        <circle cx="1002" cy="20" r="7" fill="rgba(255,230,100,0.9)" />
        <rect x="1460" y="20" width="5" height="65" />
        <circle cx="1442" cy="20" r="7" fill="rgba(255,230,100,0.9)" />
        <rect x="1940" y="5" width="6" height="80" />
        <circle cx="1943" cy="13" r="5" fill="rgba(255,50,50,0.9)" />
      </g>
    </svg>

    <div class="route-line"></div>
    <svg class="route-dots" style="height:7px" viewBox="0 0 900 7" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <g fill="rgba(232,25,44,0.8)">
        <circle cx="0" cy="3.5" r="2.5" />
        <circle cx="60" cy="3.5" r="2.5" />
        <circle cx="120" cy="3.5" r="2.5" />
        <circle cx="180" cy="3.5" r="2.5" />
        <circle cx="240" cy="3.5" r="2.5" />
        <circle cx="300" cy="3.5" r="2.5" />
        <circle cx="360" cy="3.5" r="2.5" />
        <circle cx="420" cy="3.5" r="2.5" />
        <circle cx="480" cy="3.5" r="2.5" />
        <circle cx="540" cy="3.5" r="2.5" />
        <circle cx="600" cy="3.5" r="2.5" />
        <circle cx="660" cy="3.5" r="2.5" />
        <circle cx="720" cy="3.5" r="2.5" />
        <circle cx="780" cy="3.5" r="2.5" />
        <circle cx="840" cy="3.5" r="2.5" />
      </g>
    </svg>

    <!-- DELIVERY BIKE -->
    <div class="delivery-wrapper">
      <img src="food-deliver.png" class="delivery-img" alt="Delivery boy">
      <div class="delivery-shadow"></div>
    </div>

    <!-- ROAD -->
    <div class="road-container">
      <div class="road-surface"></div>
      <div class="road-edge-top"></div>
      <div class="road-edge-bot"></div>
      <div class="road-markings" id="roadMarkings"></div>
      <div class="road-glow"></div>
    </div>

    <!-- FOOD ITEMS - NOW SHOWING -->
    <div class="foods-layer">
      <div class="food-item" style="left:8%;top:22%;--ft:6s;--fd:0s">🥟<div class="food-label">Momo</div>
      </div>
      <div class="food-item" style="left:20%;top:18%;--ft:7s;--fd:0.8s">🍕<div class="food-label">Pizza</div>
      </div>
      <div class="food-item" style="left:38%;top:14%;--ft:5.5s;--fd:0.4s">🍔<div class="food-label">Burger</div>
      </div>
      <div class="food-item" style="left:57%;top:20%;--ft:6.5s;--fd:1.2s">🍜<div class="food-label">Chowmein</div>
      </div>
      <div class="food-item" style="left:72%;top:15%;--ft:5s;--fd:0.6s">☕<div class="food-label">Coffee</div>
      </div>
      <div class="food-item" style="left:85%;top:22%;--ft:7.5s;--fd:1s">🥦<div class="food-label">Veg</div>
      </div>
      <div class="food-item" style="left:47%;top:26%;--ft:5.8s;--fd:1.5s">🌮<div class="food-label">Snack</div>
      </div>
      <div class="food-item" style="left:28%;top:25%;--ft:6.2s;--fd:0.3s">🍱<div class="food-label">Combo</div>
      </div>
    </div>

    <!-- PARTICLES -->
    <div class="particles" id="particles"></div>

    <!-- ATMOSPHERIC EFFECTS -->
    <div class="vignette"></div>
    <div class="horizon-glow"></div>

    <!-- END SCREEN - NOW SHOWS WITH LOGO -->
    <div class="end-screen">
      <div class="end-bg"></div>
      <div class="end-content">
        <div class="end-logo-ring">
          <img src="image.png" alt="SindhuliBazar Logo">
        </div>
        <div class="end-brand">Sindhuli<span>Bazar</span></div>
        <div class="end-domain">.com</div>
        <div class="end-divider"></div>
        <div class="end-tagline">Fresh Food. <strong>Delivered Fast.</strong></div>
        <div class="end-badges">
          <div class="end-badge">⚡ 30-min delivery</div>
          <div class="end-badge">🌟 Top rated</div>
          <div class="end-badge">🔒 Safe & fresh</div>
        </div>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>

</html>
